name: Tests

on:
  schedule:
    - cron: "47 4 * * 4"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  MPLBACKEND: Agg

jobs:
  test:
    name: "${{ matrix.os }}, Python ${{ matrix.python-version }}"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --group test .

    - name: "Run tests with coverage"
      run: >-
        coverage run -m pytest
        --junitxml=./test-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml

    - name: "Prepare coverage reports"
      run: coverage xml
      
    - name: "Check coverage"
      run: coverage report --fail-under=60

    - name: "Upload coverage to CodeCov"
      if: >-
        ${{ github.ref == 'refs/heads/main'
        && matrix.os == 'ubuntu-latest'
        && matrix.python-version == '3.14' }}
      uses: codecov/codecov-action@v5
      with:
        fail_ci_if_error: false
        files: coverage.xml
        flags: unittests
        token: ${{ secrets.CODECOV_TOKEN }}
        name: "CodeCov report"
        verbose: true

  slow-tests:
    name: "Slow tests with Windows, Python 3.14"
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .

      - name: Run slow tests
        run: pytest -m "slow and not gui and not visual"
