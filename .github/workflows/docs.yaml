name: Documentation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install documentation dependencies
        run: >-
          uv sync --locked --no-default-groups
          --group docs --group jupyter

      - name: Build documentation
        run: uv run --no-sync sphinx-build -M html ./docs ./docs/build
